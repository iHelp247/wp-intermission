<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>{{SITE_NAME}}</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: white;
        overflow: hidden;
        background: #000510;
    }

    .bg {
        position: fixed;
        width: 100%;
        height: 100%;
        /* A new site has no background image, so the gradient is the default.
           To add one: upload via Media Library, then put its URL on a line
           ABOVE the gradient, like so —
           background:
               url('https://your-site.example/wp-content/uploads/2026/07/bg.png') no-repeat center center/cover,
               radial-gradient(circle at 50% 35%, #0a2540 0%, #000510 70%);   */
        background:
            radial-gradient(circle at 50% 35%, #0a2540 0%, #000510 70%);
        z-index: -3;
        animation: slowZoom 30s ease-in-out infinite alternate;
    }

    @keyframes slowZoom {
        from { transform: scale(1); }
        to { transform: scale(1.05); }
    }

    .overlay {
        position: fixed;
        width: 100%;
        height: 100%;
        background:
            radial-gradient(circle at center, rgba(0, 20, 40, 0.4), rgba(0, 5, 15, 0.9)),
            linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.85));
        z-index: -2;
    }

    .glass {
        position: fixed;
        width: 100%;
        height: 100%;
        backdrop-filter: blur(2px);
        z-index: -1;
    }

    .container {
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        flex-direction: column;
        padding: 20px;
        animation: fadeIn 1.2s ease;
    }

    .logo {
        width: 320px;
        max-width: 80%;
        margin-bottom: 40px;
        filter:
            drop-shadow(0 0 30px rgba(255,255,255,0.15))
            drop-shadow(0 0 60px rgba(0,150,255,0.1));
        transition: all 0.4s ease;
    }

    .logo:hover {
        transform: scale(1.04);
        filter:
            drop-shadow(0 0 40px rgba(255,255,255,0.25))
            drop-shadow(0 0 80px rgba(0,150,255,0.2));
    }

    h1 {
        font-size: 28px;
        font-weight: 500;
        letter-spacing: 1.2px;
        margin-bottom: 14px;
    }

    .line {
        width: 70px;
        height: 2px;
        margin: 18px auto;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    }

    p {
        font-size: 16px;
        color: rgba(255,255,255,0.75);
        max-width: 520px;
        line-height: 1.5;
    }

    .footer {
        position: absolute;
        bottom: 25px;
        font-size: 12px;
        color: rgba(255,255,255,0.5);
        letter-spacing: 0.5px;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>
<div class="glass"></div>

<div class="container">

    <!-- No media ships with the plugin. Upload a logo via the WordPress Media
         Library (stored update-safe in wp-content/uploads/) and reference its
         URL here or in your content; a missing image hides itself cleanly. -->
    <img src="{{ASSETS_URL}}/logo.png" alt="{{SITE_NAME}} logo" class="logo" onerror="this.style.display='none'">

    {{CONTENT}}

</div>

<div class="footer">
    &copy; {{YEAR}} {{SITE_NAME}}
</div>

</body>
</html>
